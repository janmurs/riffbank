<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0b0f" />

  <link rel="manifest" href="./manifest.json" />
  <title>RiffBank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link rel="apple-touch-icon" href="icon-1024.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <!-- Global audio element -->
  <audio id="globalAudio" playsinline preload="metadata"></audio>

<div id="miniPlayer" class="miniPlayer hidden" aria-hidden="true">
  <div class="miniTop">
    <div class="miniSwipeZone">
      <div class="miniSwipeInner">
        <div id="miniArt" class="miniArt" aria-hidden="true"></div>
        <div class="miniMeta">
          <div id="miniTitle" class="miniTitle"></div>
          <div id="miniSub" class="miniSub"></div>
        </div>
      </div>
    </div>

    <div class="miniControls" role="group" aria-label="Mini player controls">
      <button id="miniToggle" class="miniBtn miniPlay" aria-label="Play/Pause">▶</button>
    </div>
  </div>

  <input id="miniScrub" class="miniScrub" type="range" min="0" max="1000" value="0" aria-label="Progress" />
</div>

  <!-- Splash / Loading -->
  <div id="splash" aria-hidden="false">
    <div class="splashInner">
      <div id="splashTitle">RiffBank</div>

      <div id="splashSub" class="splashSub">
        <span id="splashSubText" class="splashSubText">Indexing your universe</span>

        <span class="splashEllipsis" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
      </div>

    </div>
  </div>

  <!-- App shell -->
  <div class="app">
    <header class="topbar">
      <button id="headerBack" class="headerBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="titleblock">
        <h1 id="headerTitle">RiffBank</h1>
      </div>
      <div class="top-actions"></div>
    </header>

    <!-- Drawer overlay + panel -->
    <div id="drawerOverlay" class="drawerOverlay" aria-hidden="true"></div>

    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawerHeader">
        <div class="drawerTitle">Menu</div>
        <button id="drawerCloseBtn" class="ghost iconbtn" aria-label="Close menu">✕</button>
      </div>

      <div class="drawerSection">
        <div class="drawerLabel">Library</div>
        <button class="drawerItem" data-drawer="projects">Projects</button>
        <button class="drawerItem" data-drawer="eps">EPs</button>
        <button class="drawerItem" data-drawer="collabs">Collaborators</button>
      </div>

      <div class="drawerSection">
        <div class="drawerLabel">Tools</div>
        <button class="drawerItem" data-drawer="importExport">Import / Export</button>
      </div>

      <div class="drawerSection">
        <div class="drawerLabel">About</div>
        <button class="drawerItem" data-drawer="about">About</button>
      </div>
    </aside>

    <main id="view" class="view">
      <div id="back-peek"></div>
      <div id="screen-home" class="screen screen--home is-active"></div>
      <div id="screen-songs" class="screen screen--songs"></div>
      <div id="screen-player" class="screen screen--player"></div>
      <div id="screen-settings" class="screen screen--settings"></div>
      <div id="screen-collab" class="screen screen--collab"></div>
      <div id="screen-drawer" class="screen screen--drawer"></div>
    </main>

    <!-- Create bottom sheet -->
    <div id="sheetOverlay" class="sheetOverlay" aria-hidden="true"></div>
    <section id="createSheet" class="sheet" aria-hidden="true">
      <div class="sheetHandle" aria-hidden="true"></div>
      <div id="sheetContent" class="sheetContent"></div>
    </section>

    <!-- Bottom Nav -->
    <nav id="bottomNav" class="bottomNav" aria-label="Bottom navigation">
      <button class="navBtn tab" data-tab="home" aria-label="Home">
        <span class="navIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
        </span>
        <span class="navLabel">Home</span>
      </button>

      <button class="navBtn tab" data-tab="player" aria-label="Player">
        <span class="navIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </span>
        <span class="navLabel">Player</span>
      </button>

      <button class="navBtn tab" data-tab="collab" aria-label="Collab">
        <span class="navIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span class="navLabel">Collab</span>
      </button>

      <button class="navBtn createNavBtn" aria-label="Create">
        <span class="navIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </span>
        <span class="navLabel">Create</span>
      </button>

      <button class="navBtn salNavBtn" aria-label="Sal">
        <span class="navIcon" aria-hidden="true">
          <img src="./sal.png" alt="Sal" class="salNavImg">
        </span>
        <span class="navLabel">Sal</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <div style="display:none">
    <button id="exportBtn"></button>
    <input id="importFile" type="file" accept="application/json" />
    <input id="audioFilePicker" type="file" accept="audio/*" />
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
