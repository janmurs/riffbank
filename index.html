<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0b0f" />

  <link rel="manifest" href="./manifest.json" />
  <title>RiffBank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="apple-touch-icon" href="icon-1024.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./styles.css" />
</head>

<!-- Global audio element (do not place inside #view) -->
<audio id="globalAudio" playsinline preload="metadata"></audio>

<!-- Mini player bar -->
<div id="miniPlayer" class="miniPlayer hidden" aria-hidden="true">
  <div class="miniArt" id="miniArt" aria-hidden="true"></div>

  <div class="miniLeft">
    <div class="miniTitle" id="miniTitle">Nothing playing</div>
    <div class="miniSubRow">
      <div class="miniSub" id="miniSub">—</div>
      <div class="miniBadge" id="miniQueueBadge" style="display:none;">0</div>
    </div>

    <input id="miniScrub" class="miniScrub" type="range" min="0" max="1000" value="0" />
  </div>

  <div class="miniRight">
    <button class="miniBtn" id="miniPrev" aria-label="Previous">⏮</button>
    <button class="miniBtn miniPlay" id="miniToggle" aria-label="Play/Pause">▶</button>
    <button class="miniBtn" id="miniNext" aria-label="Next">⏭</button>
  </div>
</div>

<body>
  <!-- Splash -->
  <div id="splash" class="splash" aria-hidden="false">
    <div class="splashInner">
      <div class="splashLogo">RiffBank</div>
      <div class="splashSub">loading…</div>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="titleblock">
        <h1 id="headerTitle">RiffBank</h1>
      </div>
      <div class="top-actions"></div>
    </header>

    <!-- Drawer overlay + panel -->
    <div id="drawerOverlay" class="drawerOverlay" aria-hidden="true"></div>

    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawerHeader">
        <div class="drawerTitle">Menu</div>
        <button id="drawerCloseBtn" class="ghost iconbtn" aria-label="Close menu">✕</button>
      </div>

      <div class="drawerSection">
        <div class="drawerLabel">Library</div>
        <button class="drawerItem" data-drawer="projects">Projects</button>
        <button class="drawerItem" data-drawer="eps">EPs</button>
        <button class="drawerItem" data-drawer="collabs">Collaborators</button>
      </div>

      <div class="drawerSection">
        <div class="drawerLabel">Tools</div>
        <button class="drawerItem" data-drawer="importExport">Import / Export</button>
      </div>

      <div class="drawerSection">
        <div class="drawerLabel">About</div>
        <button class="drawerItem" data-drawer="about">About</button>
      </div>
    </aside>

    <main id="view" class="view"></main>

    <!-- Create bottom sheet -->
    <div id="sheetOverlay" class="sheetOverlay" aria-hidden="true"></div>

    <section id="createSheet" class="sheet" aria-hidden="true">
      <div class="sheetHandle" aria-hidden="true"></div>
      <div id="sheetContent" class="sheetContent"></div>
    </section>

    <!-- =========================
         Suno-style Bottom Nav
         ========================= -->
    <nav class="bottomNav" aria-label="Bottom navigation">

      <!-- Left: Player -->
      <button class="navBtn tab" data-tab="player" aria-label="Player">
        <span class="navIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M9 7l10 5-10 5V7Z" fill="currentColor"></path>
          </svg>
        </span>
        <span class="navLabel">Player</span>
      </button>

      <!-- Center: Home (Suno pill, icon only) -->
      <button class="tab navHomePill" data-tab="home" aria-label="Home">
        <span class="navIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M9 18a2 2 0 1 1-2-2h2v2Z" fill="currentColor"></path>
            <path d="M9 16V6l12-2v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M21 16a2 2 0 1 1-2-2h2v2Z" fill="currentColor"></path>
          </svg>
        </span>
      </button>

      <!-- Right: Settings -->
      <button class="navBtn tab" data-tab="settings" aria-label="Settings">
        <span class="navIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="2"></path>
            <path d="M19.4 13.5c.04-.5.04-1 0-1.5l2-1.5-2-3.4-2.4 1a8.7 8.7 0 0 0-1.3-.8l-.4-2.6H10l-.4 2.6c-.45.23-.9.5-1.3.8l-2.4-1-2 3.4 2 1.5c-.04.5-.04 1 0 1.5l-2 1.5 2 3.4 2.4-1c.4.3.85.56 1.3.8L10 21h4l.4-2.6c.45-.23.9-.5 1.3-.8l2.4 1 2-3.4-2-1.5Z"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
          </svg>
        </span>
        <span class="navLabel">Settings</span>
      </button>

    </nav>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <div style="display:none">
    <button id="exportBtn"></button>
    <input id="importFile" type="file" accept="application/json" />
    <input id="audioFilePicker" type="file" accept="audio/*" style="display:none" />
  </div>

  <script src="./app.js"></script>
</body>
</html>
